<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>Funny Bed Physics</title>
<style>
:root{--ink:#2b2d42;--red:#ff6b6b;--teal:#2ec4b6;--yel:#ffd166;--blue:#4d96ff;--soft:#f4f6fb;--line:#e3e7f1}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
html,body{margin:0;height:100%;background:#e9ecf5;font-family:"Segoe UI",system-ui,-apple-system,Roboto,sans-serif;color:var(--ink);overflow:hidden;overscroll-behavior:none}
button,input{font-family:inherit}
input{-webkit-user-select:text;user-select:text}
#app{position:relative;height:100vh;height:100dvh;width:min(100vw,calc(100dvh*.5625));margin:0 auto;background:#fff;overflow:hidden;box-shadow:0 0 40px #0002}
#cv{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}
.hand{font-family:"Comic Sans MS","Chalkboard SE","Marker Felt",cursive;font-weight:700}
#hud{position:absolute;left:0;right:0;top:0;padding:calc(env(safe-area-inset-top) + 10px) 12px 0;display:none;pointer-events:none;z-index:5}
#hud.on{display:block}
#hud .ib{position:absolute;top:calc(env(safe-area-inset-top) + 10px);width:42px;height:42px;border-radius:50%;border:3px solid var(--ink);background:#fff;font-size:17px;font-weight:800;pointer-events:auto;box-shadow:0 3px 0 var(--ink)}
#bExit{left:12px}#bPause{right:12px}
#hs{text-align:center;line-height:1}
#score{font-size:40px;color:var(--ink)}
#bestS{font-size:13px;opacity:.6;margin-top:4px}
#hint{position:absolute;left:0;right:0;top:90px;text-align:center;font-size:14px;color:var(--ink);opacity:.7}
.scr{position:absolute;inset:0;background:#fff;display:none;flex-direction:column;z-index:6}
.scr.on{display:flex}
.top{display:flex;align-items:center;gap:8px;padding:calc(env(safe-area-inset-top) + 10px) 14px 8px}
.top h2{margin:0;flex:1;font-size:22px}
.body{flex:1;overflow-y:auto;overflow-x:hidden;padding:6px 14px 90px;touch-action:pan-y;-webkit-overflow-scrolling:touch}
.chip{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:99px;background:var(--soft);border:2px solid var(--line);font-weight:700;font-size:14px}
.chip.coin{background:#fff6dc;border-color:#ffd166}
.btn{border:3px solid var(--ink);background:#fff;color:var(--ink);border-radius:16px;padding:11px 16px;font-size:16px;font-weight:800;box-shadow:0 4px 0 var(--ink);cursor:pointer;transition:transform .08s,box-shadow .08s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.btn.r{background:var(--red);color:#fff}.btn.g{background:var(--teal);color:#fff}.btn.y{background:var(--yel)}.btn.b{background:var(--blue);color:#fff}
.btn.sm{padding:7px 12px;font-size:14px;border-radius:12px;box-shadow:0 3px 0 var(--ink)}
.btn.big{width:100%;font-size:22px;padding:16px}
.btn[disabled],.btn.off{opacity:.45;pointer-events:none}
.card{background:#fff;border:3px solid var(--ink);border-radius:18px;padding:12px;margin:10px 0;box-shadow:0 4px 0 #2b2d4222}
.card h3{margin:0 0 8px;font-size:17px}
.row{display:flex;align-items:center;gap:10px}
.sp{flex:1}
.grid{display:grid;gap:10px}.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}.g5{grid-template-columns:repeat(5,1fr)}
.tile{border:3px solid var(--ink);border-radius:16px;padding:12px 8px;text-align:center;font-weight:800;background:var(--soft);position:relative;cursor:pointer}
.tile .ic{font-size:30px;display:block}
.tile small{display:block;font-weight:600;opacity:.7;margin-top:3px}
.dot{position:absolute;top:-6px;right:-6px;background:var(--red);color:#fff;border-radius:99px;min-width:20px;height:20px;font-size:12px;display:flex;align-items:center;justify-content:center;border:2px solid #fff}
.logo{font-size:44px;line-height:1;text-align:center;margin:6px 0 4px;color:var(--ink);text-shadow:3px 3px 0 var(--yel)}
#nav{position:absolute;left:0;right:0;bottom:0;display:none;background:#fff;border-top:3px solid var(--ink);padding:6px 6px calc(env(safe-area-inset-bottom) + 6px);z-index:8}
#nav .ni{flex:1;text-align:center;font-size:11px;font-weight:800;padding:4px 0;opacity:.5;cursor:pointer}
#nav .ni b{display:block;font-size:22px}
#nav .ni.on{opacity:1;color:var(--red)}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:4px 0 8px;touch-action:pan-x}
.tab{white-space:nowrap;padding:7px 13px;border-radius:99px;border:2px solid var(--ink);font-weight:800;font-size:13px;background:#fff;cursor:pointer}
.tab.on{background:var(--ink);color:#fff}
.bar{height:14px;border-radius:99px;background:var(--soft);border:2px solid var(--ink);overflow:hidden}
.bar i{display:block;height:100%;background:var(--teal);transition:width .4s}
.item{border:3px solid var(--ink);border-radius:16px;padding:8px;text-align:center;background:#fff;position:relative}
.item canvas{width:100%;height:78px;display:block}
.item .nm{font-weight:800;font-size:13px;margin:4px 0}
.item.lock canvas{filter:grayscale(1) brightness(.85);opacity:.7}
.item.eq{background:#e8fbf8}
.lv{aspect-ratio:1;border:3px solid var(--ink);border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:800;font-size:18px;background:#fff;position:relative;cursor:pointer}
.lv small{font-size:10px;letter-spacing:-1px;color:#f4a100;height:12px}
.lv.lk{background:var(--soft);opacity:.5}.lv.cur{background:var(--yel)}
.sw{width:50px;height:28px;border-radius:99px;background:#ccd;position:relative;border:2px solid var(--ink);cursor:pointer;flex:none}
.sw:after{content:"";position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;background:#fff;border:2px solid var(--ink);transition:left .15s}
.sw.on{background:var(--teal)}.sw.on:after{left:24px}
input[type=text],input[type=time]{border:3px solid var(--ink);border-radius:12px;padding:9px 12px;font-size:16px;width:100%;background:#fff}
.mask{position:absolute;inset:0;background:#2b2d4299;display:none;align-items:center;justify-content:center;z-index:20;padding:20px}
.mask.on{display:flex}
.box{background:#fff;border:3px solid var(--ink);border-radius:22px;padding:18px;width:100%;max-height:88%;overflow:auto;text-align:center;box-shadow:0 6px 0 var(--ink);animation:pop .25s}
.box h2{margin:0 0 8px}
@keyframes pop{from{transform:scale(.8);opacity:0}to{transform:scale(1);opacity:1}}
.bigstars{font-size:46px;letter-spacing:6px;color:#f4a100;text-shadow:2px 2px 0 var(--ink)}
#toast{position:absolute;left:50%;bottom:90px;transform:translateX(-50%) translateY(30px);background:var(--ink);color:#fff;padding:10px 16px;border-radius:14px;font-weight:700;font-size:14px;opacity:0;pointer-events:none;transition:.25s;z-index:30;max-width:90%;text-align:center}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.day{border:3px solid var(--ink);border-radius:12px;padding:8px 2px;text-align:center;font-weight:800;font-size:12px;background:#fff}
.day b{display:block;font-size:20px}
.day.done{background:#d8f5e8}.day.now{background:var(--yel);animation:pulse 1s infinite}
@keyframes pulse{50%{transform:scale(1.07)}}
.wheelwrap{position:relative;width:250px;height:250px;margin:10px auto}
.wheel{width:100%;height:100%;border-radius:50%;border:4px solid var(--ink);position:relative;transition:transform 4s cubic-bezier(.12,.7,.1,1);background:conic-gradient(#ff6b6b 0 45deg,#ffd166 0 90deg,#2ec4b6 0 135deg,#4d96ff 0 180deg,#ff6b6b 0 225deg,#ffd166 0 270deg,#2ec4b6 0 315deg,#b388ff 0 360deg)}
.wheel span{position:absolute;left:50%;top:50%;width:0;height:0;font-weight:800;font-size:15px}
.wheel span i{position:absolute;left:-30px;width:60px;text-align:center;top:-100px;font-style:normal;color:#fff;text-shadow:1px 1px 0 var(--ink)}
.ptr{position:absolute;left:50%;top:-12px;transform:translateX(-50%);font-size:30px;z-index:2}
.shake{animation:shake .5s infinite;font-size:90px}
@keyframes shake{0%,100%{transform:rotate(0)}25%{transform:rotate(-12deg)}75%{transform:rotate(12deg)}}
.bob{animation:bob 1.4s ease-in-out infinite;display:inline-block}
@keyframes bob{50%{transform:translateY(-8px) rotate(4deg)}}
.tag{display:inline-block;font-size:11px;font-weight:800;padding:2px 8px;border-radius:99px;background:var(--ink);color:#fff}
.tag.p{background:#b388ff}.tag.e{background:var(--red)}
.muted{opacity:.65;font-size:13px}
.tc{text-align:center}
.av{font-size:54px;width:90px;height:90px;border-radius:50%;border:3px solid var(--ink);display:flex;align-items:center;justify-content:center;background:var(--yel);margin:0 auto;box-shadow:0 4px 0 var(--ink)}
.badge{font-size:26px;border:3px solid var(--ink);border-radius:14px;padding:6px 0;text-align:center;background:#fff}
.badge.off{filter:grayscale(1);opacity:.35}
</style>
</head>
<body>
<div id="app">
  <canvas id="cv"></canvas>
  <div id="hud">
    <button class="ib" id="bExit" aria-label="Exit">✕</button>
    <div id="hs" class="hand"><div id="score">0</div><div id="bestS">Best 0</div></div>
    <button class="ib" id="bPause" aria-label="Pause">❚❚</button>
    <div id="hint" class="hand"></div>
  </div>
  <div id="scr" class="scr"></div>
  <div id="nav">
    <div class="ni" data-s="home" onclick="A.go('home')"><b>🏠</b><span data-t="home">Home</span></div>
    <div class="ni" data-s="shop" onclick="A.go('shop')"><b>🛍️</b><span data-t="shop">Shop</span></div>
    <div class="ni" data-s="rewards" onclick="A.go('rewards')"><b>🎁</b><span data-t="rewards">Rewards</span></div>
    <div class="ni" data-s="profile" onclick="A.go('profile')"><b>👤</b><span data-t="profile">Profile</span></div>
  </div>
  <div id="modal" class="mask"><div class="box" id="mbox"></div></div>
  <div id="toast"></div>
</div>
<script>
'use strict';
//#PURE-START
const W=360,H=640,G=1000,R=16,AY=64,DT=1/120,INK='#2b2d42';
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function rng(seed){let a=seed>>>0;return function(){a=(a+0x6D2B79F5)|0;let t=Math.imul(a^(a>>>15),1|a);t=(t+Math.imul(t^(t>>>7),61|t))^t;return((t^(t>>>14))>>>0)/4294967296}}
function oSeg(o,t){
  if(o.t==='spike'){const s=o.amp?o.amp*Math.sin(t*o.sp+o.ph):0;const x=o.vert?o.cx:o.cx+s,y=o.vert?o.cy+s:o.cy;return{x1:x,y1:y,x2:x,y2:y}}
  const c=Math.cos(o.a)*o.len/2,s=Math.sin(o.a)*o.len/2,dx=o.amp?o.amp*Math.sin(t*o.sp+o.ph):0;
  return{x1:o.cx+dx-c,y1:o.cy-s,x2:o.cx+dx+c,y2:o.cy+s};
}
function hitCap(b,ax,ay,bx,by,th,rest){
  const dx=bx-ax,dy=by-ay,l2=dx*dx+dy*dy||1;
  const t=clamp(((b.x-ax)*dx+(b.y-ay)*dy)/l2,0,1),px=ax+dx*t,py=ay+dy*t;
  let nx=b.x-px,ny=b.y-py,d=Math.hypot(nx,ny);const rr=R+th/2;
  if(d>=rr)return 0;
  if(d<1e-6){nx=0;ny=-1;d=1}else{nx/=d;ny/=d}
  b.x=px+nx*rr;b.y=py+ny*rr;
  const vn=b.vx*nx+b.vy*ny;
  if(vn<0){b.vx-=(1+rest)*vn*nx;b.vy-=(1+rest)*vn*ny;const tx=-ny,ty=nx,vt=b.vx*tx+b.vy*ty;b.vx-=vt*.04*tx;b.vy-=vt*.04*ty;return -vn}
  return .001;
}
// returns 0 running, 1 win, -1 missed, -2 spiked
function simStep(L,b,dt,t,cb){
  b.vy+=G*dt;b.x+=b.vx*dt;b.y+=b.vy*dt;
  if(b.x<R){b.x=R;b.vx=Math.abs(b.vx)*.5}else if(b.x>W-R){b.x=W-R;b.vx=-Math.abs(b.vx)*.5}
  let touched=false;
  for(const o of L.obs){
    const s=oSeg(o,t);
    if(o.t==='spike'){if(Math.hypot(b.x-s.x1,b.y-s.y1)<R+o.r-3)return -2;continue}
    const imp=hitCap(b,s.x1,s.y1,s.x2,s.y2,o.th,o.t==='pad'?1.15:.5);
    if(imp){touched=true;if(o.t==='pad'&&imp>30)b.vy-=120;if(imp>70&&cb)cb(o,imp)}
  }
  const imp2=hitCap(b,L.bedX-L.half,592,L.bedX+L.half,592,12,.3);
  if(imp2||Math.hypot(b.x-L.bedX,b.y-570)<R+22)return 1;
  const sp=Math.hypot(b.vx,b.vy);
  b.idle=(sp<25&&touched)?(b.idle||0)+dt:0;
  if(b.idle>1.2||b.y>H+80)return -1;
  return 0;
}
function dropSim(L,x,rec){
  const b={x,y:AY+L.ropeLen,vx:0,vy:0,idle:0};let t=0,st=0;
  for(let i=0;i<1700;i++){st=simStep(L,b,DT,t,null);t+=DT;if(rec&&i%8===0)rec.push([b.x,b.y]);if(st)break}
  return st;
}
function solve(L,minW){
  let best={w:0},run=0,start=0;
  for(let x=24;x<=336;x+=8){
    if(dropSim(L,x)===1){if(!run)start=x;run++;if(run*8>best.w)best={w:run*8,x:start+Math.floor((run-1)/2)*8}}else run=0;
  }
  if(best.w<minW||!best.w)return null;
  const rec=[];dropSim(L,best.x,rec);best.traj=rec;return best;
}
function genLevel(n,seed,opt){
  opt=opt||{};const d=Math.min(1,(n-1)/49),minW=Math.round(44-34*d);
  for(let att=0;att<70;att++){
    const r=rng(seed*7919+att*104729+n*31);
    const half=Math.round(60-26*d),bedX=Math.round(half+12+r()*(W-2*half-24)),ropeLen=Math.round(95+r()*35);
    const L={n,bedX,half,ropeLen,obs:[],stars:[]};
    const base=Math.round(1+n/5.2+(opt.extra||0)),cnt=Math.max(0,Math.min(11,base)-Math.floor(att/18));
    const yMin=AY+ropeLen+70,yMax=520;
    for(let i=0;i<cnt;i++){
      const roll=r();let t='bar';
      const pPad=(n>=3?.18:0)+(opt.pad||0),pSp=(n>=6?.12+.18*d:0)+(opt.spike||0),pMv=(n>=8?.12+.22*d:0)+(opt.move||0);
      if(roll<pSp)t='spike';else if(roll<pSp+pPad)t='pad';else if(r()<pMv)t='move';
      const cx=34+r()*(W-68),cy=yMin+r()*(yMax-yMin);
      if(t==='spike'){const mv=r()<d*.6;L.obs.push({t,cx,cy,r:14,th:0,amp:mv?30+r()*50:0,sp:.8+r()*1.4,ph:r()*6,vert:r()<.5})}
      else L.obs.push({t,cx,cy,len:t==='pad'?64:60+r()*60,a:(r()-.5)*(1.2+.8*d),th:t==='pad'?10:12,amp:t==='move'?36+r()*60:0,sp:.7+r()*1.3,ph:r()*6});
    }
    const s=solve(L,att>45?8:minW);
    if(s){L.sol=s;L.stars=[.22,.5,.76].map(f=>{const p=s.traj[Math.floor(s.traj.length*f)]||[s.x,300];return{x:p[0],y:p[1]}});return L}
  }
  const L={n,bedX:180,half:60,ropeLen:110,obs:[],stars:[]};L.sol=solve(L,0);
  L.stars=[.22,.5,.76].map(f=>{const p=L.sol.traj[Math.floor(L.sol.traj.length*f)];return{x:p[0],y:p[1]}});return L;
}
const LC={};
function getLevel(n,seed,opt,key){const k=n+'_'+seed+'_'+(key||'');return LC[k]||(LC[k]=genLevel(n,seed,opt))}
//#PURE-END

const $=s=>document.querySelector(s);
const cv=$('#cv'),cx=cv.getContext('2d');
let DPR=1,SC=1,OX=0,OY=0;
function resize(){const a=$('#app'),w=a.clientWidth,h=a.clientHeight;DPR=Math.min(2.5,window.devicePixelRatio||1);cv.width=Math.round(w*DPR);cv.height=Math.round(h*DPR);SC=Math.min(w/W,h/H);OX=(w-W*SC)/2;OY=(h-H*SC)/2}
window.addEventListener('resize',resize);

// ---------- drawing ----------
function rr(c,x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath()}
function limb(c,x,y,a,l,col){const x2=x+Math.sin(a)*l,y2=y+Math.cos(a)*l;c.strokeStyle=INK;c.lineWidth=8;c.beginPath();c.moveTo(x,y);c.lineTo(x2,y2);c.stroke();c.strokeStyle=col;c.lineWidth=4;c.stroke()}
function limbTo(c,x,y,x2,y2,col){c.strokeStyle=INK;c.lineWidth=8;c.beginPath();c.moveTo(x,y);c.lineTo(x2,y2);c.stroke();c.strokeStyle=col;c.lineWidth=4;c.stroke()}
function face(c,mode,tt,eyeY){
  c.strokeStyle=INK;c.fillStyle=INK;c.lineWidth=2.5;
  if(mode==='sleep'){c.beginPath();c.arc(-6,eyeY,3,0,Math.PI);c.moveTo(9,eyeY);c.arc(6,eyeY,3,0,Math.PI);c.stroke();c.beginPath();c.arc(0,eyeY+8,2.5,0,6.3);c.stroke();return}
  if(mode==='dizzy'){for(const sx of[-6,6]){c.beginPath();c.moveTo(sx-3,eyeY-3);c.lineTo(sx+3,eyeY+3);c.moveTo(sx+3,eyeY-3);c.lineTo(sx-3,eyeY+3);c.stroke()}c.beginPath();c.arc(0,eyeY+9,4,3.3,6.1);c.stroke();return}
  const big=mode==='scream'||mode==='wake';
  for(const sx of[-6,6]){c.fillStyle='#fff';c.beginPath();c.arc(sx,eyeY,big?5:4,0,6.3);c.fill();c.stroke();c.fillStyle=INK;c.beginPath();c.arc(sx+Math.sin(tt*5)*(big?0:1),eyeY+1,big?1.8:2,0,6.3);c.fill()}
  c.beginPath();
  if(mode==='scream'||mode==='wake'){c.ellipse(0,eyeY+10,4,6,0,0,6.3);c.fillStyle='#e63946';c.fill();c.stroke()}
  else if(mode==='happy'){c.arc(0,eyeY+5,6,.1,Math.PI-.1);c.stroke()}
  else{c.moveTo(-5,eyeY+10);c.quadraticCurveTo(0,eyeY+7+Math.sin(tt*6)*1.5,5,eyeY+10);c.stroke()}
}
function drawChar(c,ch,sk,x,y,rot,mode,tt,lb,sc){
  c.save();c.translate(x,y);c.rotate(rot);if(sc)c.scale(sc,sc);c.lineCap=c.lineJoin='round';
  const sh=sk.acc,hc=ch.c;
  limb(c,-4,34,lb.l1,18,hc);limb(c,4,34,lb.l2,18,hc);
  c.strokeStyle=INK;c.lineWidth=3;c.fillStyle=sh;rr(c,-9,14,18,22,7);c.fill();c.stroke();
  if(mode==='hang'){limbTo(c,-7,19,-3,-22,hc);limbTo(c,7,19,3,-22,hc)}else{limb(c,-8,19,lb.a1,18,hc);limb(c,8,19,lb.a2,18,hc)}
  c.strokeStyle=INK;c.lineWidth=3;c.fillStyle=hc;
  const f=ch.f;
  if(f==='cat'){c.beginPath();c.moveTo(-14,-6);c.lineTo(-13,-26);c.lineTo(-3,-14);c.closePath();c.moveTo(14,-6);c.lineTo(13,-26);c.lineTo(3,-14);c.closePath();c.fill();c.stroke()}
  if(f==='bear'){for(const sx of[-12,12]){c.beginPath();c.arc(sx,-12,6,0,6.3);c.fill();c.stroke()}}
  if(f==='bunny'){for(const sx of[-7,7]){c.beginPath();c.ellipse(sx,-26,4.5,12,sx<0?-.15:.15,0,6.3);c.fill();c.stroke()}}
  if(f==='robot'||f==='alien'){c.beginPath();c.moveTo(0,-14);c.lineTo(0,-27);c.stroke();c.fillStyle=f==='robot'?'#e63946':'#b388ff';c.beginPath();c.arc(0,-29,4,0,6.3);c.fill();c.stroke();c.fillStyle=hc}
  c.beginPath();c.arc(0,0,R,0,6.3);c.fill();c.stroke();
  if(f==='ninja'){c.fillStyle='#e63946';rr(c,-R,-9,R*2,9,3);c.fill();c.stroke()}
  if(f==='crown'){c.fillStyle='#ffb703';c.beginPath();c.moveTo(-10,-13);c.lineTo(-11,-27);c.lineTo(-5,-20);c.lineTo(0,-28);c.lineTo(5,-20);c.lineTo(11,-27);c.lineTo(10,-13);c.closePath();c.fill();c.stroke()}
  if(f==='none'||f==='dino'){c.beginPath();c.moveTo(-3,-15);c.quadraticCurveTo(0,-26,4,-15);c.stroke()}

function drawBed(c,bd,x,half,tt,wake,sleeperCh){

function drawTheme(c,th,w,h,tt){
  c.fillStyle=th.bg;c.fillRect(0,0,w,h);c.fillStyle=th.ac;c.strokeStyle=th.ac;
  const r=rng(7+th.pat.length);
  if(th.pat==='clouds'){for(let i=0;i<5;i++){const x=(r()*w+tt*6*(i+1))%(w+80)-40,y=40+r()*h*.7,s=18+r()*14;c.globalAlpha=.6;c.beginPath();c.arc(x,y,s,0,6.3);c.arc(x+s,y+4,s*.8,0,6.3);c.arc(x-s,y+6,s*.7,0,6.3);c.fill()}}
  else if(th.pat==='stars'){for(let i=0;i<26;i++){const x=r()*w,y=r()*h*.8;c.globalAlpha=.4+.5*Math.abs(Math.sin(tt*2+i));c.fillRect(x,y,2.5,2.5)}}
  else if(th.pat==='dots'){c.globalAlpha=.25;for(let x=10;x<w;x+=34)for(let y=10;y<h;y+=34){c.beginPath();c.arc(x,y,3,0,6.3);c.fill()}}
  else if(th.pat==='grid'){c.globalAlpha=.12;c.lineWidth=1;for(let x=0;x<w;x+=30){c.beginPath();c.moveTo(x,0);c.lineTo(x,h);c.stroke()}for(let y=0;y<h;y+=30){c.beginPath();c.moveTo(0,y);c.lineTo(w,y);c.stroke()}}
  else if(th.pat==='stripes'){c.globalAlpha=.15;for(let x=-h;x<w;x+=40){c.beginPath();c.moveTo(x,0);c.lineTo(x+h,h);c.lineTo(x+h+18,h);c.lineTo(x+18,0);c.fill()}}
  c.globalAlpha=1;
}
function drawObs(c,o,t){

    c.beginPath();for(let i=0;i<10;i++){const a=i*Math.PI/5,rad=i%2?o.r*.7:o.r+7;c.lineTo(Math.cos(a)*rad,Math.sin(a)*rad)}c.closePath();c.fill();c.stroke();
    c.fillStyle='#fff';c.beginPath();c.arc(0,0,4,0,6.3);c.fill();c.restore();return;

  c.strokeStyle='#fff8';c.lineWidth=2;c.beginPath();c.moveTo(s.x1+4,s.y1-2);c.lineTo(s.x2-4,s.y2-2);c.stroke();
}

// ---------- game ----------
const Game={st:'off',paused:false,parts:[],texts:[],rope:[],body:null,limb:{a1:2,a2:-2,l1:.2,l2:-.2},rot:0,rv:0,tt:0};
const WORDS=['BONK!','BOING!','OOF!','WHEE!','YEET!','OUCH!','WOAH!','BOP!'];
function ropeInit(ax,len){const N=9,seg=len/N;Game.N=N;Game.seg=seg;Game.rope=[];for(let i=0;i<=N;i++)Game.rope.push({x:ax,y:AY+i*seg,px:ax,py:AY+i*seg})}
function getCurLevel(mode,n){
  if(mode==='daily'){const d=utcDay();return getLevel(25+d%25,100000+d,{},'d')}
  if(mode==='event'){const e=evInfo();return getLevel(34,5000+e.w,e.opt,'e'+e.w)}
  return getLevel(n,1000+n*37);
}
function startGame(mode,n){
  closeModal();$('#scr').className='scr';$('#nav').style.display='none';
  const L=getCurLevel(mode,n);
  Object.assign(Game,{mode,n,L,st:'hang',paused:false,t:0,tf:0,score:0,bounces:0,got:[false,false,false],ax:W/2,tx:W/2,parts:[],texts:[],body:null,rot:0,rv:0,endT:0,shown:false,wake:0,res:0,hidden:false});
  ropeInit(Game.ax,L.ropeLen);
  $('#hud').classList.add('on');$('#score').textContent='0';
  $('#hs').style.color=(THEMES[S.equip.themes]||{}).dark?'#fff':INK;
  const best=mode==='level'?(S.bestScore[n]||0):mode==='daily'?((S.dch[ukey()]||{}).score||0):S.ev.best;
  $('#bestS').textContent=t('best')+' '+best;
  $('#hint').textContent=(mode==='level'&&n<=3)?t('hint'):'';
  track('level_start',{mode,n});
}
function stepRope(dt){
  const R_=Game.rope,N=R_.length;
  for(let i=1;i<N;i++){const p=R_[i],vx=(p.x-p.px)*.985,vy=(p.y-p.py)*.985;p.px=p.x;p.py=p.y;p.x+=vx;p.y+=vy+G*dt*dt}
  for(let k=0;k<22;k++){
    R_[0].x=Game.ax;R_[0].y=AY;
    for(let i=0;i<N-1;i++){const a=R_[i],b=R_[i+1];let dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy)||1,df=(d-Game.seg)/d;
      if(i===0){b.x-=dx*df;b.y-=dy*df}else{a.x+=dx*df*.5;a.y+=dy*df*.5;b.x-=dx*df*.5;b.y-=dy*df*.5}}
  }
}
function cutRope(){
  if(Game.st!=='hang')return;
  const p=Game.rope[Game.rope.length-1];
  Game.body={x:p.x,y:p.y,vx:clamp((p.x-p.px)/DT,-500,500)*.35,vy:clamp((p.y-p.py)/DT,-300,600),idle:0};
  Game.drop={x:+Game.body.x.toFixed(2),y:+Game.body.y.toFixed(2),vx:+Game.body.vx.toFixed(2),vy:+Game.body.vy.toFixed(2)};
  Game.rope.pop();Game.st='fall';Game.tf=0;Game.rot=Game.lastRot||0;Game.rv=Game.body.vx*.006;
  $('#hint').textContent='';sfx('cut');vib(15);burst(p.x,p.y,6,'#c69c6d');
  addText(p.x,p.y-30,'SNIP!');
}
function burst(x,y,n,col,txt){for(let i=0;i<n;i++){const a=Math.random()*6.28,s=60+Math.random()*180;Game.parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-80,life:.7+Math.random()*.4,max:1,col,sz:3+Math.random()*4,txt})}}
function addText(x,y,s){Game.texts.push({x,y,s,life:1})}
function setLimbs(dt){
  const L=Game.limb,tt=Game.tt,m=Game.st;let a1,a2,l1,l2;
  if(m==='fall'){a1=2.3+Math.sin(tt*14)*.7;a2=-2.3-Math.sin(tt*14+1)*.7;l1=.5+Math.sin(tt*11)*.6;l2=-.5-Math.sin(tt*11+2)*.6}
  else if(m==='won'){a1=2.7;a2=-2.7;l1=.4+Math.sin(tt*10)*.3;l2=-.4-Math.sin(tt*10)*.3}
  else if(m==='lost'){a1=1.2;a2=-1.2;l1=.3;l2=-.3}
  else{const sw=clamp(Game.swing||0,-1,1);a1=2.8;a2=-2.8;l1=.15+sw*.6+Math.sin(tt*3)*.08;l2=-.15+sw*.6-Math.sin(tt*3)*.08}
  const k=Math.min(1,dt*18);L.a1+=(a1-L.a1)*k;L.a2+=(a2-L.a2)*k;L.l1+=(l1-L.l1)*k;L.l2+=(l2-L.l2)*k;
}
function update(dt){
  const g=Game;g.tt+=dt;g.t+=dt;
  for(const p of g.parts){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=500*dt;p.life-=dt}
  g.parts=g.parts.filter(p=>p.life>0);
  for(const x of g.texts){x.y-=30*dt;x.life-=dt*1.1}g.texts=g.texts.filter(x=>x.life>0);
  setLimbs(dt);
  if(g.st==='hang'){
    g.ax+=(g.tx-g.ax)*Math.min(1,dt*9);
    stepRope(dt);
    const r=g.rope,a=r[r.length-2],b=r[r.length-1];
    g.lastRot=Math.atan2(-(b.x-a.x),b.y-a.y);g.rot=g.lastRot;g.swing=(b.x-b.px)*40;
  }else if(g.st==='fall'){
    g.tf+=dt;stepRope(dt);
    g.rot+=g.rv*dt*60*.5;g.rv*=.999;
    const b=g.body;
    const res=simStep(g.L,b,dt,g.tf,(o,imp)=>{
      g.bounces++;g.rv+=(Math.random()-.5)*8;
      const w=o.t==='pad'?'BOING!':WORDS[Math.floor(Math.random()*WORDS.length)];addText(b.x,b.y-26,w);
      const fx=FXE[S.equip.fx];burst(b.x,b.y,fx?7:4,'#ffd166',fx);sfx(o.t==='pad'?'boing':'bonk');vib(25);
      g.score=g.got.filter(Boolean).length*150+Math.min(g.bounces,6)*100;$('#score').textContent=g.score;
    });
    g.swing=b.vx/200;
    for(let i=0;i<3;i++)if(!g.got[i]){const s=g.L.stars[i];if(Math.hypot(b.x-s.x,b.y-s.y)<R+14){g.got[i]=true;burst(s.x,s.y,10,'#ffd166','⭐');sfx('star');addText(s.x,s.y-20,'+★');g.score=g.got.filter(Boolean).length*150+Math.min(g.bounces,6)*100;$('#score').textContent=g.score}}
    if(res===1){g.st='won';g.wake=1;g.endT=0;g.res=1;sfx('win');vib([40,40,80]);addText(b.x,b.y-40,'AAAH!');for(let i=0;i<30;i++)burst(b.x,b.y,1,['#ff6b6b','#ffd166','#2ec4b6','#4d96ff'][i%4])}
    else if(res<0||g.tf>15){g.st='lost';g.endT=0;g.res=res;g.hidden=res===-2;sfx('lose');vib(120);
      if(res===-2){burst(b.x,b.y,20,'#e63946');addText(b.x,b.y-20,'OOPS!')}else addText(clamp(b.x,40,320),560,'MISSED!')}
  }else if(g.st==='won'||g.st==='lost'){
    g.endT+=dt;g.tf+=dt;stepRope(dt);
    if(g.endT>(g.st==='won'?1.1:.9)&&!g.shown){g.shown=true;finish(g.st==='won')}
  }
}
function draw(){
  const g=Game;if(g.st==='off')return;
  const th=THEMES[S.equip.themes]||THEMES[0];
  cx.setTransform(1,0,0,1,0,0);cx.clearRect(0,0,cv.width,cv.height);
  cx.setTransform(DPR,0,0,DPR,0,0);drawTheme(cx,th,$('#app').clientWidth,$('#app').clientHeight,g.tt);
  cx.setTransform(DPR*SC,0,0,DPR*SC,OX*DPR,OY*DPR);
  const ch=CHARS[S.equip.chars]||CHARS[0],sk=SKINS[S.equip.skins]||SKINS[0],bd=BEDS[S.equip.beds]||BEDS[0];
  cx.lineCap='round';cx.strokeStyle='#9aa3b8';cx.lineWidth=5;cx.beginPath();cx.moveTo(14,AY);cx.lineTo(W-14,AY);cx.stroke();
  cx.fillStyle='#9aa3b8';cx.strokeStyle=INK;cx.lineWidth=3;cx.beginPath();cx.arc(g.ax,AY,8,0,6.3);cx.fill();cx.stroke();
  const ot=g.st==='hang'?0:g.tf;
  for(const o of g.L.obs)drawObs(cx,o,ot);
  drawBed(cx,bd,g.L.bedX,g.L.half,g.tt,g.wake,CHARS[1]);
  for(let i=0;i<3;i++)if(!g.got[i]){const s=g.L.stars[i];cx.save();cx.translate(s.x,s.y);cx.rotate(Math.sin(g.tt*3+i)*.3);const sc=1+Math.sin(g.tt*4+i)*.1;cx.scale(sc,sc);cx.fillStyle='#ffd166';cx.strokeStyle=INK;cx.lineWidth=2.5;cx.beginPath();for(let k=0;k<10;k++){const a=k*Math.PI/5-Math.PI/2,r=k%2?5:12;cx.lineTo(Math.cos(a)*r,Math.sin(a)*r)}cx.closePath();cx.fill();cx.stroke();cx.restore()}
  cx.lineCap='round';cx.lineJoin='round';
  if(g.rope.length>1){cx.beginPath();cx.moveTo(g.rope[0].x,g.rope[0].y);for(let i=1;i<g.rope.length;i++)cx.lineTo(g.rope[i].x,g.rope[i].y);cx.strokeStyle=INK;cx.lineWidth=6;cx.stroke();cx.strokeStyle='#d9b38c';cx.lineWidth=3;cx.stroke()}
  if(g.st==='hang'){
    const p=g.rope[g.rope.length-1];
    if(g.mode==='level'&&g.n<=5){cx.setLineDash([6,8]);cx.strokeStyle='#2b2d4255';cx.lineWidth=2;cx.beginPath();cx.moveTo(p.x,p.y+40);cx.lineTo(p.x,586);cx.stroke();cx.setLineDash([])}
    drawChar(cx,ch,sk,p.x,p.y,g.rot,'hang',g.tt,g.limb);
    const pul=1+Math.sin(g.tt*6)*.08;cx.save();cx.translate(p.x+34,p.y-6);cx.scale(pul,pul);cx.font='bold 15px "Comic Sans MS",cursive';cx.fillStyle=INK;cx.textAlign='center';cx.fillText(t('tapcut'),0,0);cx.restore();
  }else if(g.body&&!g.hidden){
    drawChar(cx,ch,sk,g.body.x,g.body.y,g.rot,g.st==='won'?'happy':g.st==='lost'?'dizzy':'scream',g.tt,g.limb);
  }
  for(const p of g.parts){cx.globalAlpha=clamp(p.life*2,0,1);if(p.txt){cx.font=Math.round(p.sz*3)+'px serif';cx.textAlign='center';cx.fillText(p.txt,p.x,p.y)}else{cx.fillStyle=p.col;cx.fillRect(p.x,p.y,p.sz,p.sz)}}cx.globalAlpha=1;
  for(const x of g.texts){cx.globalAlpha=clamp(x.life,0,1);cx.font='bold 22px "Comic Sans MS",cursive';cx.textAlign='center';cx.lineWidth=5;cx.strokeStyle='#fff';cx.strokeText(x.s,x.x,x.y);cx.fillStyle='#e63946';cx.fillText(x.s,x.x,x.y)}cx.globalAlpha=1;
}
let lastTs=0,acc=0;
function loop(ts){
  requestAnimationFrame(loop);
  const dt=Math.min(.05,(ts-lastTs)/1000||0);lastTs=ts;
  if(Game.st!=='off'&&!Game.paused&&!document.hidden){acc+=dt;while(acc>=DT){update(DT);acc-=DT}}
  draw();
}

let AC=null,musicTimer=null;
function audioInit(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(AC&&AC.state==='suspended')AC.resume();startMusic()}
function tone(f,d,type,v,slide){if(!AC||!S.st.sound)return;const o=AC.createOscillator(),g=AC.createGain();o.type=type||'sine';o.frequency.setValueAtTime(f,AC.currentTime);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,slide),AC.currentTime+d);g.gain.setValueAtTime(v||.15,AC.currentTime);g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+d);o.connect(g);g.connect(AC.destination);o.start();o.stop(AC.currentTime+d)}
function sfx(k){
  if(k==='bonk')tone(220,.15,'square',.12,90);else if(k==='boing')tone(300,.35,'sine',.18,900);else if(k==='cut')tone(900,.08,'sawtooth',.08,200);
  else if(k==='star')tone(880,.12,'triangle',.15,1500);else if(k==='win'){[523,659,784,1046].forEach((f,i)=>setTimeout(()=>tone(f,.2,'triangle',.16),i*110))}
  else if(k==='lose')tone(300,.5,'sawtooth',.12,60);else if(k==='coin'){tone(988,.08,'square',.08);setTimeout(()=>tone(1319,.15,'square',.08),70)}
  else if(k==='click')tone(600,.05,'square',.05);
}
function startMusic(){
  if(musicTimer||!AC)return;const mel=[523,659,784,659,587,698,880,698,523,659,784,1046,988,784,659,587];let i=0;
  musicTimer=setInterval(()=>{if(!S.st.music||document.hidden)return;const f=mel[i++%mel.length];if(!AC||!S.st.sound&&false)return;
    const o=AC.createOscillator(),g=AC.createGain();o.type='triangle';o.frequency.value=f/2;g.gain.setValueAtTime(.035,AC.currentTime);g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+.4);o.connect(g);g.connect(AC.destination);o.start();o.stop(AC.currentTime+.4)},330);
}

function seasonInfo(){const e=dnum('2026-11-01');const idx=Math.max(0,Math.floor((dnum(dkey())-e)/30));const end=new Date(2026,10,1+(idx+1)*30).getTime();return{idx,end,day:dnum(dkey())-e-idx*30+1}}
function evInfo(){const w=Math.floor((dnum(dkey())+3)/7),e=EVT[w%4];return{w,...e,end:new Date(1970,0,1+(w+1)*7-3).getTime()}}
let pendingProtect=false;
function applyStreak(protect){
  const td=dkey(),s=S.streak;
  if(protect){if(!spend(RC.streakProtectCost,'streak_protect')){s.cur=1}else s.cur++}else if(pendingProtect)s.cur=1;
  if(s.cur>s.best)s.best=s.cur;s.last=td;pendingProtect=false;
  const r=earn(Math.min(s.cur,10)*10,'streak');if(r)toast('🔥 '+s.cur+'-day streak! +'+r);
  save();checkAch();
}
function bootDaily(){
  const td=dkey(),s=S.streak;
  if(s.last!==td){
    const gap=s.last?dnum(td)-dnum(s.last):1;
    if(!s.last||gap===1){s.cur++;applyStreakInc()}
    else if(gap===2&&S.coins>=RC.streakProtectCost&&s.cur>=2){pendingProtect=true;setTimeout(()=>modal(`<div class="bob" style="font-size:60px">🔥</div><h2 class="hand">Save your ${s.cur}-day streak?</h2><p class="muted">You missed a day. Protect it for ${RC.streakProtectCost} coins, or start again at 1.</p><div class="row"><button class="btn g sp" onclick="A.protect(true)">🛡️ ${RC.streakProtectCost} 🪙</button><button class="btn sp" onclick="A.protect(false)">Reset</button></div>`),600)}
    else{s.cur=1;applyStreakInc()}
  }
  if(S.login7.last&&dnum(td)-dnum(S.login7.last)>1)S.login7.next=0;
  if(S.missions.d!==td){S.missions={d:td,bonus:false,list:[{id:'wins',goal:3,prog:0,r:60,c:false},{id:'score',goal:500,prog:0,r:50,c:false},{id:'games',goal:5,prog:0,r:40,c:false}]}}
  const se=seasonInfo();if(S.season.id!==se.idx)S.season={id:se.idx,xp:0,f:[],p:[]},S.sp=false;
  const ev=evInfo();if(S.ev.w!==ev.w)S.ev={w:ev.w,wins:0,best:0,claimed:false};
  if(S.lastSeen&&dnum(td)-dnum(S.lastSeen)>=3){const c=earn(RC.comebackReward,'comeback',true);S.chest.next=0;setTimeout(()=>modal(`<div class="bob" style="font-size:80px">🎉</div><h2 class="hand">Welcome back, ${esc(S.name)}!</h2><p>We missed you! Here's a comeback gift:</p><div class="bigstars">+${c} 🪙</div><p class="muted">Your free chest is ready too.</p><button class="btn g big" onclick="A.close()">Yay!</button>`),400)}
  S.lastSeen=td;save();
}
function applyStreakInc(){const td=dkey(),s=S.streak;if(s.cur>s.best)s.best=s.cur;s.last=td;const r=earn(Math.min(s.cur,10)*10,'streak');save();setTimeout(()=>toast('🔥 '+s.cur+'-day streak! +'+r),900)}

// ---------- finish a run ----------
function finish(win){
  const g=Game,n=g.n,stars=g.got.filter(Boolean).length,bn=Math.min(g.bounces,6);
  const score=win?500+bn*100+stars*150:stars*150+bn*50;
  S.games++;mis('games',1);let coins=0,first=false;
  if(win){S.wins++;mis('wins',1);if(stars===3)S.perfects++;coins=20+stars*10+Math.min(n,50);
    if(g.mode==='level'){first=!S.stars[n];if(first)coins+=30;S.stars[n]=Math.max(S.stars[n]||0,stars);if(n===S.level&&S.level<50)S.level++}
    S.piggy=Math.min(RC.piggyCap,S.piggy+RC.piggyPerWin*(1+stars))}
  mis('score',score,true);
  if(g.mode==='level'){S.bestScore[n]=Math.max(S.bestScore[n]||0,score)}
  S.best=Math.max(S.best,score);
  let extra='';
  if(g.mode==='daily'){const k=ukey(),h=S.dch[k]||{score:0,won:false};h.score=Math.max(h.score,score);
    if(win&&!h.won){h.won=true;S.dcWins++;const cs=S.cstreak,y=new Date(Date.now()-864e5).toISOString().slice(0,10);cs.cur=cs.last===y?cs.cur+1:1;cs.best=Math.max(cs.best,cs.cur);cs.last=k;const c=earn(RC.dailyReward,'daily_challenge');coins+=c;extra=`<p>🏅 Challenge streak: ${cs.cur} · +${c} 🪙</p>`}
    S.dch[k]=h}
  if(g.mode==='event'){S.ev.best=Math.max(S.ev.best,score);if(win)S.ev.wins++}
  const paid=earn(coins,'level');
  const ups=addXp(20+(win?30+stars*10:0));
  checkAch();save();
  track(win?'level_win':'level_lose',{mode:g.mode,n,score,stars,bounces:g.bounces});
  submitScore(g.mode==='level'?'level_'+n:g.mode,score,win,stars);
  const li=levelInfo(S.xp);
  $('#hud').classList.remove('on');
  const upl=ups.length?`<div class="card" style="background:#fff6dc">⬆️ <b>Level up!</b><br>${ups.join('<br>')}</div>`:'';
  const nm=g.mode==='level'?`${t('level')} ${n}`:g.mode==='daily'?t('daily'):t('event');
  if(win){
    modal(`<h2 class="hand">${t('complete')}</h2><div class="muted">${nm}</div>
      <div class="bigstars">${'★'.repeat(stars)}<span style="opacity:.2">${'★'.repeat(3-stars)}</span></div>
      <div class="hand" style="font-size:34px">${score}</div><div class="muted">${t('best')}: ${g.mode==='level'?S.bestScore[n]:S.best}</div>
      <p>+${paid} 🪙 · +${20+30+stars*10} XP${S.premium?' · 2x 👑':''}</p>${extra}
      <div class="bar"><i style="width:${li.cur/li.need*100}%"></i></div><div class="muted">Lv ${li.lvl} · ${li.cur}/${li.need} XP</div>${upl}
      <div class="grid g2" style="margin-top:12px">${g.mode==='level'&&n<50?`<button class="btn g" onclick="A.next()">${t('next')} ▶</button>`:`<button class="btn g" onclick="A.restart()">↻ ${t('restart')}</button>`}<button class="btn y" onclick="A.shareMenu()">📤 ${t('share')}</button><button class="btn" onclick="A.restart()">↻ ${t('retry')}</button><button class="btn" onclick="A.exit()">🏠 ${t('home')}</button></div>`);
    g.last={n,score,stars,mode:g.mode};
  }else{
    modal(`<div style="font-size:60px">${g.res===-2?'💥':'😵'}</div><h2 class="hand">${t('gameover')}</h2><p class="muted">${g.res===-2?'Ouch, spikes!':'You missed the bed!'}</p><div class="hand" style="font-size:28px">${t('score')}: ${score}</div><p>+${paid} 🪙 · +20 XP</p>${upl}
      <div class="grid g2" style="margin-top:12px"><button class="btn r" onclick="A.restart()">↻ ${t('retry')}</button><button class="btn" onclick="A.exit()">🏠 ${t('home')}</button></div>`);
  }
}
async function submitScore(board,score,win,stars){
  if(!win||!Backend.on())return;
  try{const r=await Backend.call('/score',{board,score,stars,level:Game.n,drop:Game.drop,v:CONFIG.VERSION});
    if(r.rank)toast('🏁 Rank #'+r.rank);if(r.reward)earn(r.reward,'rank_'+board,true);}catch(e){track('score_submit_fail',{board})}
}

  save();modal('<div class="shake" id="cst">🎁</div><p class="muted">Opening…</p>');vib(60);setTimeout(()=>{$('#mbox').innerHTML=msg+'<button class="btn g big" style="margin-top:10px" onclick="A.close();render()">Awesome!</button>';sfx('win');schedNotifs()},1300);track('chest_open')},
 spinning:false,
 doSpin(){if(A.spinning)return;const free=spinReady();if(!free&&!spend(RC.spinCost,'spin'))return;A.spinning=true;if(free)S.spin.last=dkey();
  const w=[22,10,15,8,20,5,14,6],tot=w.reduce((a,b)=>a+b,0);let x=Math.random()*tot,idx=0;for(;idx<8;idx++){x-=w[idx];if(x<0)break}if(idx>7)idx=0;
  const wl=document.getElementById('wheel'),deg=360*6+(360-(idx*45+22.5));wl.style.transform=`rotate(${deg}deg)`;save();track('spin',{idx});
  setTimeout(()=>{A.spinning=false;const vals=[20,50,30,100,40,200,60,0];let m;if(idx===7){const lk=randomLocked();if(lk){giveItem(lk[0],lk[1]);m='🌟 Rare: '+ITEMS[lk[0]][lk[1]].n}else m='🌟 +'+earn(300,'spin_rare')}else m='+'+earn(vals[idx],'spin')+' 🪙';
   toast('🎡 '+m);sfx('win');render()},4300)},
 seasonClaim(i,p){const se=S.season;if(se.xp<(i+1)*100)return;if(p){if(!(S.premium||S.sp)||se.p.includes(i))return;se.p.push(i);earn(80+i*20,'season_p',true);const ex=i===4?['skins',5]:i===9?['skins',6]:i===14?['chars',8]:null;if(ex)giveItem(ex[0],ex[1])}else{if(se.f.includes(i))return;se.f.push(i);earn(30+i*10,'season_f',true)}save();render()},
 tog(k){S.st[k]=!S.st[k];save();if(k==='notif'&&S.st.notif)askNotif();else schedNotifs();render();audioInit()},
 ntime(v){S.st.time=v||'20:00';save();schedNotifs()},
 lang(l){S.lang=l;save();render()},
 editProfile(){modal(`<h2 class="hand">Edit profile</h2><div class="grid g5" style="margin:10px 0">${AVATARS.map(a=>`<div class="badge ${a===S.avatar?'':'off'}" onclick="A.setAv('${a}')">${a}</div>`).join('')}</div><input type="text" id="pn" maxlength="16" value="${esc(S.name)}"><button class="btn g big" style="margin-top:12px" onclick="A.saveProfile()">Save</button>`)},
 setAv(a){S.avatar=a;A.editProfile()},
 saveProfile(){const v=$('#pn').value.trim().slice(0,16);if(v)S.name=v;save();closeModal();render()},
 history(){modal(`<h2 class="hand">Reward history</h2><div style="text-align:left;max-height:50vh;overflow:auto">${S.hist.map(h=>`<div class="row" style="padding:5px 0;border-bottom:1px solid var(--line)"><span class="sp">${esc(h.s)}<div class="muted">${new Date(h.t).toLocaleString()}</div></span><b style="color:${h.a>0?'#2ec4b6':'#e63946'}">${h.a>0?'+':''}${h.a}</b></div>`).join('')||'<p class="muted">Nothing yet</p>'}</div><button class="btn big" style="margin-top:10px" onclick="A.close()">${t('close')}</button>`)},
 legal(k){const u=k==='privacy'?RC.privacyUrl:RC.termsUrl;if(u){window.open(u,'_blank','noopener');return}
  const txt=k==='privacy'?'<p>Funny Bed Physics stores your progress on your device. If you sign in, progress, coins, XP and purchases are synced to our servers. We collect gameplay analytics. We show no ads and sell no personal data. You can export or delete your data in Settings.</p><p class="muted">⚠️ Placeholder text: publish your real policy and set <code>privacyUrl</code> in the remote config before release.</p>':'<p>By playing you agree to play fairly. Coins and items have no cash value. Purchases are handled by Google Play and are subject to its terms. We may update rewards and remove cheated progress.</p><p class="muted">⚠️ Placeholder text: publish real terms and set <code>termsUrl</code> in the remote config before release.</p>';
  modal(`<h2 class="hand">${t(k)}</h2><div style="text-align:left">${txt}</div><button class="btn big" onclick="A.close()">${t('close')}</button>`)},
 exportData(){const b=new Blob([JSON.stringify(S,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='funny-bed-physics-data.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000)},
 delAcc(){modal(`<div style="font-size:50px">⚠️</div><h2 class="hand">Delete account?</h2><p class="muted">All progress, coins and purchases tied to this player will be erased${Backend.on()?' from this device and our servers':' from this device'}. This cannot be undone.</p><div class="row"><button class="btn sp" onclick="A.close()">Cancel</button><button class="btn r sp" onclick="A.delConfirm()">Delete</button></div>`)},
 async delConfirm(){try{if(Backend.on())await Backend.call('/account/delete',{});}catch(e){toast('Server deletion failed. Try again online.');return}
  localStorage.removeItem(KEY);localStorage.removeItem('fbp_an');S=defaults();location.reload()},
 async checkUpdate(){await remoteConfig();if(RC.minVersion>CONFIG.VERSION)updatePrompt();else toast('✅ You have the latest version')},
 useRef(){const v=($('#refin').value||'').trim().toUpperCase();if(!v)return;if(v===S.ref.code){toast("You can't use your own code");return}if(S.ref.used){toast('A code was already used');return}redeemRef(v)},
 share(kind){shareResult(kind)},
 buy(sku){Billing.buy(sku)}
};

// ---------- sharing ----------
function resultText(){const l=Game.last||{n:S.level,score:S.best,stars:0},st='⭐'.repeat(l.stars)+'▫️'.repeat(3-l.stars);
  return `Funny Bed Physics 🛏️💥\n${l.mode==='daily'?'Daily Challenge':'Level '+l.n} ${st}\nScore ${l.score} 🔥 ${S.streak.cur}-day streak\n${'🟩'.repeat(Math.max(1,l.stars+1))}\nBeat me 👉 `+challengeLink(l)}
function challengeLink(l){return CONFIG.SHARE_URL+'?c='+(l&&l.mode==='level'?l.n:S.level)+'&ref='+S.ref.code}
async function cardBlob(){
  const l=Game.last||{n:S.level,score:S.best,stars:0,mode:'level'};const c=document.createElement('canvas');c.width=1080;c.height=1920;const g=c.getContext('2d');
  drawTheme(g,THEMES[S.equip.themes],1080,1920,0);g.textAlign='center';g.fillStyle=INK;g.font='bold 110px "Comic Sans MS",cursive';g.fillText('Funny Bed',540,230);g.fillText('Physics',540,350);
  g.save();g.translate(540-180*2.6,700-440*2.6+260);g.scale(2.6,2.6);drawBed(g,BEDS[S.equip.beds],180,60,0,1,CHARS[1]);drawChar(g,CHARS[S.equip.chars],SKINS[S.equip.skins],180,440,.2,'happy',0,{a1:2.7,a2:-2.7,l1:.4,l2:-.4});g.restore();
  g.fillStyle=INK;g.font='bold 90px "Comic Sans MS",cursive';g.fillText(l.mode==='daily'?'Daily Challenge':'Level '+l.n,540,1330);
  g.font='120px serif';g.fillText('⭐'.repeat(l.stars)+'☆'.repeat(3-l.stars),540,1470);
  g.font='bold 150px "Comic Sans MS",cursive';g.fillText(String(l.score),540,1640);g.font='bold 56px "Comic Sans MS",cursive';g.fillText('🔥 '+S.streak.cur+'-day streak · '+S.name,540,1740);
  g.font='bold 44px sans-serif';g.fillText('Challenge me: '+CONFIG.SHARE_URL.replace(/^https?:\/\//,''),540,1850);
  return new Promise(r=>c.toBlob(r,'image/png'));
}
async function shareResult(kind){
  const text=resultText();let ok=false;
  try{
    if(kind==='wa'){window.open('https://wa.me/?text='+encodeURIComponent(text),'_blank','noopener');ok=true}
    else{const blob=await cardBlob(),file=new File([blob],'funny-bed-physics.png',{type:'image/png'});
      if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],text,title:'Funny Bed Physics'});ok=true}
      else if(navigator.share&&kind==='any'){await navigator.share({text,url:challengeLink(Game.last)});ok=true}
      else{const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='funny-bed-physics.png';a.click();toast('Image saved. Share it from your gallery.')}}
  }catch(e){return}
  if(!ok)return;
  const sh=S.shares,td=dkey();if(sh.d!==td){sh.d=td;sh.c=0}
  if(kind==='ig'&&!S.ig){S.ig=true;toast('📸 Story bonus +'+earn(RC.igBonus,'ig_bonus'))}
  else if(sh.c>=3)toast('Daily share rewards used (3/3)');
  else if(Date.now()-sh.last<6e5)toast('Next share reward in '+Math.ceil((6e5-(Date.now()-sh.last))/6e4)+' min');
  else{sh.c++;sh.last=Date.now();toast('Share reward +'+earn(RC.shareReward,'share')+' ('+sh.c+'/3 today)')}
  save();track('share',{kind});
}
// patch share buttons: add WhatsApp + Instagram next to generic share
A.shareMenu=()=>modal(`<h2 class="hand">${t('share')}</h2><div class="grid" style="margin-top:10px"><button class="btn g big" onclick="A.share('wa')">WhatsApp</button><button class="btn big" style="background:#ff7aa2;color:#fff" onclick="A.share('ig')">Instagram Story</button><button class="btn y big" onclick="A.share('any')">More…</button><button class="btn big" onclick="A.close()">${t('close')}</button></div><p class="muted">Share rewards: max 3/day, 10 min apart. Story bonus once.</p>`);

// ---------- backend / billing / cloud ----------
const Backend={
  on(){return !!CONFIG.API_BASE&&!!CONFIG.AUTH()},
  async call(path,body){const r=await fetch(CONFIG.API_BASE+path,{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+CONFIG.AUTH()},body:JSON.stringify(body||{})});if(!r.ok)throw new Error('HTTP '+r.status);return r.json()}
};
function mergeSave(a,b){
  const n=a.ts>=b.ts?a:b,o=n===a?b:a,m=JSON.parse(JSON.stringify(n));
  for(const k of['games','wins','best','xp','perfects','dcWins','level'])m[k]=Math.max(a[k]||0,b[k]||0);
  m.streak.best=Math.max(a.streak.best,b.streak.best);m.cstreak.best=Math.max(a.cstreak.best,b.cstreak.best);
  for(const c of CATS)m.owned[c]=[...new Set([...(a.owned[c]||[]),...(b.owned[c]||[])])];
  m.ach={...o.ach,...n.ach};m.colB={...o.colB,...n.colB};
  for(const k of['stars','bestScore']){m[k]={};for(const l of new Set([...Object.keys(a[k]||{}),...Object.keys(b[k]||{})]))m[k][l]=Math.max((a[k]||{})[l]||0,(b[k]||{})[l]||0)}
  m.premium=!!(a.premium||b.premium);m.sp=!!(a.sp||b.sp);m.starter=!!(a.starter||b.starter);
  m.ts=Math.max(a.ts,b.ts);return m;
}
const Cloud={
  async pull(){if(!Backend.on())return;try{const r=await Backend.call('/save/get');if(r&&r.save){S=mergeSave(S,Object.assign(defaults(),r.save));localStorage.setItem(KEY,JSON.stringify(S));if($('#scr').classList.contains('on')&&Game.st==='off')render();await Cloud.push()}}catch(e){}},
  async push(){if(!Backend.on())return;try{await Backend.call('/save/put',{save:S,clientVersion:CONFIG.VERSION})}catch(e){}}
};
const Billing={
  async buy(sku){
    if(!('getDigitalGoodsService' in window)||!window.PaymentRequest||!Backend.on()){
      modal(`<div style="font-size:50px">🛒</div><h2 class="hand">Purchases unavailable here</h2><p class="muted">Real payments run through Google Play Billing inside the Play Store app (Trusted Web Activity) and are verified by your server. This build is not connected, so nothing was charged and nothing was granted.</p><button class="btn big" onclick="A.close()">${t('ok')}</button>`);return}
    try{
      const svc=await window.getDigitalGoodsService('https://play.google.com/billing');
      const req=new PaymentRequest([{supportedMethods:'https://play.google.com/billing',data:{sku}}]);
      const res=await req.show(),token=res.details.purchaseToken;
      const v=await Backend.call('/iap/verify',{sku,token});
      if(v&&v.ok){await res.complete('success');if(sku.startsWith('coins_')||sku==='piggy_unlock'){try{await svc.consume(token)}catch(e){}}else{try{await svc.acknowledge&&svc.acknowledge(token,'onetime')}catch(e){}}
        if(v.save)S=mergeSave(S,Object.assign(defaults(),v.save));Billing.grant(sku,v);}
      else{await res.complete('fail');toast('Purchase could not be verified')}
    }catch(e){toast('Purchase cancelled')}
  },
  grant(sku,v){
    const co=(n)=>earn(n,'iap_'+sku,true);
    if(sku==='coins_s')co(500);else if(sku==='coins_m')co(1500);else if(sku==='coins_l')co(4000);
    else if(sku==='starter'&&!S.starter){S.starter=true;co(1500);giveItem('chars',2);giveItem('skins',1)}
    else if(sku==='bundle_chars'){[3,4,5].forEach(i=>giveItem('chars',i))}
    else if(sku==='premium'){S.premium=true}
    else if(sku==='season_pass'){S.sp=true}
    else if(sku==='piggy_unlock'){co(S.piggy);S.piggy=0}
    save();render();toast('✅ Purchase complete');track('iap',{sku});
  }
};
async function redeemRef(code){
  if(!Backend.on()){S.ref.pend=code;save();toast('Code saved. It will be verified when you are online and signed in.');return}
  try{const r=await Backend.call('/referral/redeem',{code});if(r.ok){S.ref.used=code;S.ref.pend='';earn(r.reward||RC.referralReward,'referral',true);toast('🎉 Referral accepted!')}else toast('Invalid or already used code')}catch(e){toast('Could not verify code')}
}
async function remoteConfig(){if(!CONFIG.REMOTE_URL)return;try{const ctl=new AbortController();setTimeout(()=>ctl.abort(),4000);const r=await fetch(CONFIG.REMOTE_URL,{signal:ctl.signal,cache:'no-store'});Object.assign(RC,await r.json());localStorage.setItem('fbp_rc',JSON.stringify(RC))}catch(e){try{Object.assign(RC,JSON.parse(localStorage.getItem('fbp_rc')||'{}'))}catch(_){}}}
function updatePrompt(){modal(`<div style="font-size:50px">⬆️</div><h2 class="hand">Update available</h2><p class="muted">A newer version is required for the latest rewards and fixes.</p>${CONFIG.STORE_URL?`<a class="btn g big" style="display:block;text-decoration:none" href="${CONFIG.STORE_URL}">Update</a>`:''}<button class="btn big" style="margin-top:8px" onclick="A.close()">Later</button>`)}

// ---------- notifications (works while the app is open; see INTEGRATION.md for real push) ----------
let nTimers=[];
async function askNotif(){if(!('Notification' in window)){toast('Notifications not supported here');S.st.notif=false;save();return}const p=await Notification.requestPermission();if(p!=='granted'){S.st.notif=false;toast('Permission denied');save();render()}else schedNotifs()}
function notify(title,body){try{if(Notification.permission==='granted')new Notification(title,{body})}catch(e){}}
function schedNotifs(){
  nTimers.forEach(clearTimeout);nTimers=[];
  if(!S.st.notif||!('Notification' in window)||Notification.permission!=='granted')return;
  const[h,m]=S.st.time.split(':').map(Number),now=new Date(),at=new Date();at.setHours(h,m,0,0);if(at<=now)at.setDate(at.getDate()+1);
  const msg=S.streak.cur>0?['🔥 Keep your '+S.streak.cur+'-day streak alive!','Play today to protect it.']:['🛏️ Your daily reward is waiting!','Claim your login bonus and today\'s challenge.'];
  nTimers.push(setTimeout(()=>notify(msg[0],msg[1]),at-now));
  const cw=S.chest.next-Date.now();if(cw>0&&cw<864e5)nTimers.push(setTimeout(()=>notify('🎁 Your free chest is ready!','Open it for coins and characters.'),cw));
}

// ---------- boot ----------
function boot(){
  try{Object.assign(RC,JSON.parse(localStorage.getItem('fbp_rc')||'{}'))}catch(e){}
  resize();bootDaily();checkAch();
  const q=new URLSearchParams(location.search);
  if(q.get('ref')&&!S.ref.used&&q.get('ref')!==S.ref.code)setTimeout(()=>redeemRef(q.get('ref').toUpperCase()),1500);
  if(S.ref.pend&&Backend.on())redeemRef(S.ref.pend);
  A.go('home');
  const c=parseInt(q.get('c'));if(c>=1&&c<=50)setTimeout(()=>modal(`<div style="font-size:50px">🥊</div><h2 class="hand">A friend challenged you!</h2><p>Beat them on <b>Level ${c}</b></p><div class="row"><button class="btn g sp" onclick="A.challenge(${c})">Accept</button><button class="btn sp" onclick="A.close()">Later</button></div>`),700);
  A.challenge=n=>{closeModal();startGame('level',Math.min(n,S.level>=n?n:S.level))};
  remoteConfig().then(()=>{if(RC.minVersion>CONFIG.VERSION)updatePrompt()});
  Cloud.pull();schedNotifs();
  document.addEventListener('pointerdown',audioInit,{once:true});
  requestAnimationFrame(loop);
  track('app_open');
}
boot();
</script>
